name: Urth release packaging

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/build-image/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - '.goreleaser.yaml'
      - 'packaging/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitignore'
      - 'Makefile'
      - 'website/Dockerfile'
      - 'website/.dockerignore'
      - 'website/nginx.conf.template'
      - 'docs/releases.md'
      - 'docs/container-images.md'

permissions:
  contents: read
  packages: read

env:
  # Match the patched compiler used by the image recipes, not an older module floor.
  RELEASE_GO_VERSION: '1.27.1'
  # GoReleaser builds the binaries, archives, Debian packages and snaps.
  GORELEASER_VERSION: 'v2.18.2'

# Serialize release tags so stable alias promotion does not race another tag.
# Snapshot validation has its own group and cannot cancel a publishing run.
concurrency:
  group: urth-packaging-${{ github.event_name == 'push' && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate source and version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      created: ${{ steps.source.outputs.created }}
      stable: ${{ steps.source.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag or snapshot
        id: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          if [ "$EVENT" = push ]; then
            test "$REF_TYPE" = tag
            python3 scripts/build-release.py --version "$TAG" --metadata-only > "$RUNNER_TEMP/source.json"
            # Do not replace an existing GitHub release. Unexpected API errors
            # fail closed rather than treating access failure as absence.
            if gh api "repos/$GH_REPO/releases/tags/$TAG" > /dev/null 2> "$RUNNER_TEMP/release-query.err"; then
              echo 'This version already has a release; select a new version.' >&2
              exit 1
            elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/release-query.err"; then
              cat "$RUNNER_TEMP/release-query.err" >&2
              exit 1
            fi
          else
            python3 scripts/build-release.py --snapshot --metadata-only > "$RUNNER_TEMP/source.json"
          fi
          jq -r '"version=\(.version)", "revision=\(.revision)",
            "created=\(.created)", "stable=\(.stable)"' \
            "$RUNNER_TEMP/source.json" >> "$GITHUB_OUTPUT"

  backend:
    if: github.event_name == 'push'
    needs: metadata
    uses: ./.github/workflows/go.yml

  website:
    if: github.event_name == 'push'
    needs: metadata
    uses: ./.github/workflows/website.yml

  archives:
    name: Build and inspect all archives and packages
    needs: [metadata, backend, website]
    # PRs already run the ordinary quality workflows; snapshots never publish.
    # Tags cannot build release assets until both exact-tag gates succeed.
    if: >-
      always() && !cancelled() && needs.metadata.result == 'success' &&
      (github.event_name == 'pull_request' ||
      (needs.backend.result == 'success' && needs.website.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@sre-norns'
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      # The Worker snap's hook and service wrapper run under /bin/sh in core24.
      - name: Check snap scripts
        run: shellcheck -s sh packaging/snap/*/*
      # GoReleaser packs snaps with snapcraft; packing needs no build provider.
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Build website assets
        working-directory: website
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
      - name: Build archives
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if [ "$EVENT" = push ]; then
            python3 scripts/build-release.py --version "$VERSION"
          else
            python3 scripts/build-release.py --snapshot
          fi
          python3 scripts/check-release.py --output dist/release --smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: urth-archives
          path: dist/release/*
          if-no-files-found: error

  image-snapshots:
    name: Validate ${{ matrix.image }} without publication
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.metadata.result == 'success' && needs.archives.result == 'success'
    needs: [metadata, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: urth-api-srv, context: '.', file: Dockerfile, target: api-server}
          - {image: urth-worker, context: '.', file: Dockerfile, target: worker}
          - {image: urthctl, context: '.', file: Dockerfile, target: cli}
          - {image: urth-web, context: website, file: website/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          version: ${{ needs.metadata.outputs.version }}
          revision: ${{ needs.metadata.outputs.revision }}
          created: ${{ needs.metadata.outputs.created }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  image-publication:
    name: Publish ${{ matrix.image }} version tag
    if: github.event_name == 'push'
    needs: [metadata, backend, website, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: urth-api-srv, context: '.', file: Dockerfile, target: api-server}
          - {image: urth-worker, context: '.', file: Dockerfile, target: worker}
          - {image: urthctl, context: '.', file: Dockerfile, target: cli}
          - {image: urth-web, context: website, file: website/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        id: image
        with:
          image: ${{ matrix.image }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          version: ${{ needs.metadata.outputs.version }}
          revision: ${{ needs.metadata.outputs.revision }}
          created: ${{ needs.metadata.outputs.created }}
          publish: 'true'
          registry-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record image digest
        env:
          IMAGE: ghcr.io/sre-norns/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {key.lower(): os.environ[key] for key in ('IMAGE', 'DIGEST', 'VERSION', 'REVISION')}
          Path('image.json').write_text(json.dumps(record) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.image }}
          path: image.json

  release:
    name: Record complete release and stable aliases
    if: github.event_name == 'push'
    needs: [metadata, backend, website, archives, image-publication]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: urth-archives
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-*
          path: dist/digests
      - name: Validate digest records
        run: |
          python3 scripts/record-release-images.py --output dist/release --images dist/digests
          python3 scripts/check-release.py --output dist/release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote stable images and create the GitHub release
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          STABLE: ${{ needs.metadata.outputs.stable }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$STABLE" = true ]; then
            jq -r '.images[] | [.image, .digest] | @tsv' dist/release/images.json |
              while IFS=$'\t' read -r image digest; do
                docker buildx imagetools create --tag "$image:latest" "$image@$digest"
              done
            gh release create "$VERSION" dist/release/* --verify-tag --title "Urth $VERSION" --generate-notes --latest
          else
            gh release create "$VERSION" dist/release/* --verify-tag --title "Urth $VERSION" --generate-notes --prerelease --latest=false
          fi

  # Optional: the Snap Store needs an account credential that this repository
  # does not have by default. Without SNAPCRAFT_STORE_CREDENTIALS the snaps stay
  # GitHub release assets only, and this job reports that and succeeds.
  snap-store:
    name: Upload snaps to the Snap Store
    if: github.event_name == 'push'
    needs: [metadata, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: urth-archives
          path: dist/release
      - name: Upload to the stable or candidate channel
        env:
          STABLE: ${{ needs.metadata.outputs.stable }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo '::notice::SNAPCRAFT_STORE_CREDENTIALS is not set; snaps are published only as release assets.'
            exit 0
          fi
          channel=candidate
          if [ "$STABLE" = true ]; then channel=stable; fi
          sudo snap install snapcraft --classic
          for snap in dist/release/*.snap; do
            snapcraft upload --release="$channel" "$snap"
          done
