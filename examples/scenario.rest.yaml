apiVersion: urth.sre-norns.com/v1
kind: scenarios
metadata:
  name: rest-self-prob
  labels:
    app: rest-prob
    function: backend
spec:
  active: true
  description: "REST prob running a .http script against Urth's own API"
  schedule: "@5minutes"
  prob:
    kind: rest
    timeout: 10s
    spec:
      # An IntelliJ-style `.http` script. See pkg/http-parser/README.md for the
      # syntax this parser implements, and for what it deliberately rejects.
      script: |
        @base_url = http://localhost:8080/v1

        ### Server version
        # @name GetVersion
        GET {{base_url}}/version
        Accept: application/json

        ### Check the version again
        # @name GetVersionAgain
        GET {{base_url}}/version
        Accept: application/json
