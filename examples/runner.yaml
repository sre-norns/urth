apiVersion: v1
kind: runners
metadata:
  name: "example-runner-yaml"
  labels:
    env: "dev" 
    nature: "test-runner"
spec:
  active: true
  description: "A runner resource example"
  requirements:
    matchSelector:
      - { "key": "urth/capability.prob.tcp", "operator":"Exists"}
      - { "key": "urth/capability.prob.http", "operator":"Exists"}
      - { "key": "urth/capability.prob.har", "operator":"Exists"}
      - { "key": "urth/capability.prob.puppeteer", "operator":"Exists"}
